  <style>

<body class="bg-slate-50 text-slate-800 font-sans antialiased select-none">

  <!-- 메인 모바일 뷰포트 -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-5 relative">
    
    <!-- 1. 헤더 (앱 아이콘 미니 뱃지 포함) -->
    <header class="flex justify-between items-center py-2">
      <div class="flex items-center gap-2.5">
        <!-- 상단 헤더에 들어가는 미니 앱 로고 -->
        <div class="w-9 h-9 rounded-xl bg-[#3b0914] shadow-sm flex items-center justify-center border border-white/20">
          <span class="text-base">🍷</span>
        </div>
        <div>
          <h1 class="text-lg font-black text-slate-900 tracking-tight leading-none">VINTAGE RADAR</h1>
          <p class="text-[11px] text-slate-400 mt-1">현장 전용 빈티지 판별기</p>
        </div>
      </div>
      <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700">
        OFFLINE OK
      </span>
    </header>

    <!-- 2. AI 라벨 스캐너 (대형 터치 영역) -->
    <section class="my-4 space-y-3">
      <label class="flex items-center justify-center gap-3 w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl text-base font-bold shadow-md cursor-pointer transition">
        <span class="text-xl">📷</span> 라벨 즉시 촬영
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
      </label>
      
      <label class="flex items-center justify-center gap-3 w-full py-3.5 bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-700 rounded-2xl text-sm font-semibold border border-slate-200 shadow-sm cursor-pointer transition">
        <span class="text-lg">🖼️</span> 앨범에서 사진 선택
        <input type="file" id="galleryInput" accept="image/*" class="hidden">
      </label>
    </section>

    <!-- 3. 산지 직접 탐색 (여유로운 카드 뷰) -->
    <section class="grow flex flex-col">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">국가 및 산지 빠른 조회</h2>
        <span class="text-[11px] text-slate-400">오프라인 지원</span>
      </div>

      <!-- 국가 탭 바 (가로 스크롤) -->
      <div id="countryTabs" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2"></div>

      <!-- 선택된 국가의 대표 산지 카드 (2열 그리드) -->
      <div id="regionGrid" class="grid grid-cols-2 gap-2.5 mt-2"></div>
    </section>

    <!-- 하단 푸터 -->
    <footer class="text-center text-[11px] text-slate-400 py-2">
      1900년 ~ 현재 빈티지만 판별 대상입니다.
    </footer>
  </div>

  <!-- 4. 분석 중 로딩 화면 (타임아웃 적용) -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white hidden">
    <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-sm font-bold tracking-tight">라벨 분석 중...</p>
    <p class="text-xs text-slate-300 mt-1">산지와 수확 연도를 추출하고 있습니다.</p>
  </div>

  <!-- 5. 빈티지 매트릭스 바텀 시트 (결과 팝업) -->
  <div id="bottomSheetBackdrop" class="fixed inset-0 bg-black/40 z-40 hidden flex flex-col justify-end">
    <div id="backdropClickArea" class="grow"></div>
    
    <div id="bottomSheet" class="bg-white rounded-t-3xl p-5 shadow-2xl max-w-md mx-auto w-full bottom-sheet transform translate-y-full">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3 cursor-pointer" onclick="closeBottomSheet()"></div>
      
      <div class="flex justify-between items-center mb-3">
        <div>
          <h3 id="sheetTitle" class="text-base font-extrabold text-slate-900">산지 빈티지 차트</h3>
          <p id="sheetSubTitle" class="text-[11px] text-slate-400">2000 ~ 2024년 작황 매트릭스</p>
        </div>
        <button id="closeSheetBtn" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center text-sm">✕</button>
      </div>

      <!-- 5x5 빈티지 매트릭스 타일 그리드 -->
      <div id="vintageMatrix" class="grid grid-cols-5 gap-1.5 my-2"></div>

      <!-- 선택된 연도 상세 카드 -->
      <div class="mt-3 bg-slate-50 rounded-2xl p-3.5 border border-slate-200">
        <div class="flex items-center justify-between mb-1">
          <span id="detailYearText" class="text-sm font-black text-slate-900">-</span>
          <span id="detailBadge" class="text-[11px] font-bold px-2 py-0.5 rounded-md">-</span>
        </div>
        <p id="detailComment" class="text-xs text-slate-600 line-clamp-2">-</p>
      </div>
    </div>
  </div>

    const YEARS = Array.from({ length: 25 }, (_, i) => 2024 - i);
    let currentCountry = 'france';
    let currentRegion = '보르도';
    let currentYear = 2016;

    // ── 화면 초기화 ──
    function initUI() {
      renderCountryTabs();
      renderRegionGrid();
    }

    function renderCountryTabs() {
      const tabs = document.getElementById('countryTabs');
      tabs.innerHTML = Object.entries(COUNTRY_DATA).map(([key, item]) => `
        <button onclick="selectCountry('${key}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition border ${
          currentCountry === key ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-white text-slate-600 border-slate-200'
        }">
          ${item.flag} ${item.name}
        </button>
      `).join('');
    }

    function selectCountry(cKey) {
      currentCountry = cKey;
      currentRegion = COUNTRY_DATA[cKey].regions[0];
      renderCountryTabs();
      renderRegionGrid();
    }

    function renderRegionGrid() {
      const grid = document.getElementById('regionGrid');
      const regions = COUNTRY_DATA[currentCountry].regions;
      grid.innerHTML = regions.map(reg => `
        <button onclick="openBottomSheet('${reg}', 2019)" class="p-4 bg-white hover:border-indigo-400 active:scale-95 border border-slate-200 rounded-2xl text-left shadow-sm transition flex flex-col justify-between h-20">
          <span class="text-sm font-extrabold text-slate-800">${reg}</span>
          <span class="text-[11px] text-indigo-600 font-bold flex items-center justify-between">차트 열기 <span>→</span></span>
        </button>
      `).join('');
    }

    // ── 바텀 시트 인터랙션 ──
    function openBottomSheet(region, targetYear) {
      currentRegion = region;
      currentYear = targetYear || 2019;
      
      document.getElementById('sheetTitle').innerText = `${region} 빈티지 차트`;
      renderMatrix();
      updateDetailCard(currentYear);

      const backdrop = document.getElementById('bottomSheetBackdrop');
      const sheet = document.getElementById('bottomSheet');
      backdrop.classList.remove('hidden');
      setTimeout(() => sheet.classList.remove('translate-y-full'), 10);
    }

    function closeBottomSheet() {
      const sheet = document.getElementById('bottomSheet');
      sheet.classList.add('translate-y-full');
      setTimeout(() => document.getElementById('bottomSheetBackdrop').classList.add('hidden'), 250);
    }

    document.getElementById('backdropClickArea').addEventListener('click', closeBottomSheet);
    document.getElementById('closeSheetBtn').addEventListener('click', closeBottomSheet);

    function renderMatrix() {
      const container = document.getElementById('vintageMatrix');
      const scores = VINTAGE_SCORES[currentRegion] || {};

      container.innerHTML = YEARS.map(yr => {
        const item = scores[yr] || { g: 'GOOD' };
        let colorClass = 'bg-amber-400 text-amber-950 border-amber-500';
        if (item.g === 'BEST') colorClass = 'bg-emerald-600 text-white border-emerald-700 shadow-sm';
        if (item.g === 'AVOID') colorClass = 'bg-rose-500 text-white border-rose-600';

        const isSelected = yr === currentYear;
        return `
          <button onclick="selectYear(${yr})" class="py-2 rounded-xl text-xs font-black border transition flex flex-col items-center justify-center ${colorClass} ${
            isSelected ? 'ring-2 ring-slate-900 ring-offset-2 scale-105 z-10' : 'opacity-90'
          }">
            ${yr}
          </button>
        `;
      }).join('');
    }

    function selectYear(yr) {
      currentYear = yr;
      renderMatrix();
      updateDetailCard(yr);
    }

    function updateDetailCard(yr) {
      const info = (VINTAGE_SCORES[currentRegion] && VINTAGE_SCORES[currentRegion][yr]) || { g: 'GOOD', c: '평이하고 무난한 작황' };
      document.getElementById('detailYearText').innerText = `${yr}년 ${currentRegion}`;
      
      const badge = document.getElementById('detailBadge');
      if (info.g === 'BEST') {
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800';
        badge.innerText = '🟢 강력 추천';
      } else if (info.g === 'AVOID') {
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-rose-100 text-rose-800';
        badge.innerText = '🔴 구매 비추천';
      } else {
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-900';
        badge.innerText = '🟡 좋은 빈티지';
      }

      document.getElementById('detailComment').innerText = info.c;
    }

    // ── 이미지 클라이언트 압축 (Canvas Resize) ──
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');

    cameraInput.addEventListener('change', handleFile);
    galleryInput.addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 800;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
          sendToGemini(compressedBase64);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    // ── 백엔드 API 호출 (타임아웃 4.5초) ──
    async function sendToGemini(base64Image) {
      if (!GAS_API_URL || GAS_API_URL.includes("여기에_")) {
        alert("GAS 배포 URL이 설정되지 않았습니다.\nindex.html 상단 GAS_API_URL 변수를 확인해주세요.");
        return;
      }

      const loader = document.getElementById('loadingOverlay');
      loader.classList.remove('hidden');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4500);

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ image: base64Image }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const res = await response.json();
        loader.classList.add('hidden');

        if (!res.success || !res.data) {
          throw new Error('분석 실패');
        }

        const { region, vintage, wine_name } = res.data;

        // 1900년 ~ 현재 연도 정합성 검증
        const currentYearLimit = new Date().getFullYear();
        if (!vintage || vintage < 1900 || vintage > currentYearLimit) {
          alert('빈티지(4자리 수확 연도)를 확인할 수 없습니다.\nNV(넌빈티지) 와인이거나 연도가 다른 면에 있을 수 있습니다.');
          return;
        }

        if (!region || !VINTAGE_SCORES[region]) {
          alert(`라벨에서 [${wine_name || '와인'}]을(를) 확인했으나 등록된 대표 산지와 일치하지 않습니다.\n아래 목록에서 산지를 직접 선택해주세요.`);
          return;
        }

        openBottomSheet(region, vintage);

      } catch (err) {
        loader.classList.add('hidden');
        if (err.name === 'AbortError') {
          alert('네트워크 연결이 지연되었습니다.\n다시 시도하거나 아래 산지를 직접 터치해주세요.');
        } else {
          alert('라벨 분석에 실패했습니다. 다시 촬영해주세요.');
        }
      }
    }
