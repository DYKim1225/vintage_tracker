<!DOCTYPE html>
<html lang="ko">
<head>

  <title>와인 빈티지 파인더</title>

  <!-- PWA & 모바일 웹앱 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="빈티지파인더">
  <meta name="application-name" content="빈티지파인더">
  <meta name="theme-color" content="#3b0914">

  <!-- 아이콘 및 매니페스트 -->
  <link id="appleTouchIcon" rel="apple-touch-icon" href="">
  <link id="favicon" rel="icon" type="image/png" href="">
  <link rel="manifest" href='data:application/manifest+json,{"name":"와인 빈티지 파인더","short_name":"빈티지파인더","start_url":".","display":"standalone","background_color":"%23f8fafc","theme_color":"%233b0914"}'>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bottom-sheet { transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased select-none">

  <!-- 메인 모바일 뷰포트 (상단 노치 여백 확보) -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between px-5 pb-6 pt-[calc(max(env(safe-area-inset-top),20px)+2.5rem)] relative">
    
    <!-- 1. 헤더 -->
    <header class="flex items-center gap-3.5 py-4 mb-4">
      <canvas id="headerLogoCanvas" width="80" height="80" class="w-12 h-12 rounded-2xl shadow-sm shrink-0 border border-slate-200/60"></canvas>
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight leading-none">VINTAGE FINDER</h1>
        <p class="text-xs text-slate-400 mt-1.5 font-medium tracking-wide">스마트 글로벌 빈티지 가이드</p>
      </div>
    </header>

    <!-- 2. AI 라벨 스캐너 -->
    <section class="mb-5 space-y-3">
      <label class="flex items-center justify-center gap-3 w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl text-base font-bold shadow-md cursor-pointer transition">
        <span class="text-xl">📷</span> 라벨 즉시 촬영
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
      </label>
      
      <label class="flex items-center justify-center gap-3 w-full py-3.5 bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-700 rounded-2xl text-sm font-semibold border border-slate-200 shadow-sm cursor-pointer transition">
        <span class="text-lg">🖼️</span> 앨범에서 사진 선택
        <input type="file" id="galleryInput" accept="image/*" class="hidden">
      </label>
    </section>

    <!-- 3. 산지 직접 탐색 섹션 (오프라인 퀵 뷰) -->
    <section class="grow flex flex-col pt-1">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">주요 산지 빈티지 차트</h2>
        <span class="text-[11px] text-slate-400 font-semibold flex items-center gap-1">
          옆으로 넘겨 국가 선택 ➔
        </span>
      </div>

      <!-- 색상 가이드 바 (순화된 워딩) -->
      <div class="flex items-center justify-between bg-slate-200/60 rounded-xl px-3.5 py-2 text-[11px] font-bold text-slate-600 mb-3 border border-slate-300/40">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm"></span>강력 추천</span>
        <span class="text-slate-300">|</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-sm"></span>좋은 빈티지</span>
        <span class="text-slate-300">|</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm"></span>어려웠던 빈티지</span>
      </div>

        <div class="pointer-events-none absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-slate-50 via-slate-50/80 to-transparent"></div>
      </div>

      <div id="regionGrid" class="grid grid-cols-2 gap-2.5 mt-2"></div>
    </section>

    <footer class="text-center text-[11px] text-slate-400 py-3 mt-4">
      전 세계 모든 와인 산지 실시간 분석 지원 (1900~현재)
    </footer>
  </div>

        </div>
        <button onclick="closeAiResultSheet()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center text-sm shrink-0">✕</button>

        </div>
        <p id="aiGradeComment" class="text-xs text-slate-700 leading-relaxed font-medium">-</p>
      </div>

      <button onclick="closeAiResultSheet()" class="w-full py-3.5 bg-slate-900 active:scale-[0.98] text-white rounded-xl text-sm font-bold shadow transition">
        확인 완료
      </button>
    </div>
  </div>

  <!-- 5-B. 오프라인 5x5 빈티지 매트릭스 팝업 -->

    <div id="backdropClickArea" class="grow"></div>
    
    <div id="bottomSheet" class="bg-white rounded-t-3xl p-5 shadow-2xl max-w-md mx-auto w-full bottom-sheet transform translate-y-full">

    function generateAppIcons() {
      const cvs = document.getElementById('iconGenCanvas');
      const ctx = cvs.getContext('2d');
      drawWineGlassIcon(ctx, 180);

      const pngData = cvs.toDataURL('image/png');
      document.getElementById('appleTouchIcon').href = pngData;
      document.getElementById('favicon').href = pngData;

      const headerCvs = document.getElementById('headerLogoCanvas');
      const hCtx = headerCvs.getContext('2d');
      drawWineGlassIcon(hCtx, 80);
    }

    function drawWineGlassIcon(ctx, size) {
      const scale = size / 180;
      ctx.clearRect(0, 0, size, size);

      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#4a0e1c');
      bgGrad.addColorStop(1, '#1a0307');
      
      ctx.beginPath();
      const r = 40 * scale;
      ctx.roundRect(0, 0, size, size, r);
      ctx.fillStyle = bgGrad;
      ctx.fill();

      ctx.save();
      ctx.scale(scale, scale);

      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 6;

      const bottleGrad = ctx.createLinearGradient(45, 0, 105, 0);
      bottleGrad.addColorStop(0, '#1c0307');
      bottleGrad.addColorStop(0.35, '#821528');
      bottleGrad.addColorStop(0.7, '#420813');
      bottleGrad.addColorStop(1, '#120104');

      ctx.beginPath();
      ctx.moveTo(70, 25);
      ctx.lineTo(82, 25);
      ctx.lineTo(82, 50);
      ctx.bezierCurveTo(82, 68, 106, 82, 106, 105);
      ctx.lineTo(106, 155);
      ctx.bezierCurveTo(106, 162, 100, 165, 93, 165);
      ctx.lineTo(59, 165);
      ctx.bezierCurveTo(52, 165, 46, 162, 46, 155);
      ctx.lineTo(46, 105);
      ctx.bezierCurveTo(46, 82, 70, 68, 70, 50);
      ctx.closePath();
      ctx.fillStyle = bottleGrad;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.scale(scale, scale);
      const foilGrad = ctx.createLinearGradient(70, 0, 82, 0);
      foilGrad.addColorStop(0, '#9e782f');
      foilGrad.addColorStop(0.5, '#ffd97d');
      foilGrad.addColorStop(1, '#694f1c');
      ctx.fillStyle = foilGrad;
      ctx.fillRect(70, 22, 12, 26);
      ctx.fillRect(68, 20, 16, 4);

      ctx.fillStyle = '#f5efe4';
      ctx.fillRect(52, 102, 48, 44);
      ctx.fillStyle = '#7a1928';
      ctx.fillRect(58, 112, 36, 4);
      ctx.fillStyle = '#b09f87';
      ctx.fillRect(62, 122, 28, 2.5);
      ctx.fillStyle = '#c49a45';
      ctx.fillRect(65, 130, 22, 5);

      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(52, 105);
      ctx.lineTo(52, 152);
      ctx.stroke();

      ctx.save();
      ctx.translate(118, 118);
      ctx.rotate(45 * Math.PI / 180);

      ctx.fillStyle = '#dfaf4e';
      ctx.fillRect(-4, 40, 8, 8);

      const woodGrad = ctx.createLinearGradient(-5, 0, 5, 0);
      woodGrad.addColorStop(0, '#2e1505');
      woodGrad.addColorStop(0.5, '#5c2d0c');
      woodGrad.addColorStop(1, '#1f0d03');
      ctx.fillStyle = woodGrad;
      ctx.beginPath();
      ctx.roundRect(-5, 48, 10, 38, 4);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.lineWidth = 7;
      const brassGrad = ctx.createLinearGradient(-36, -36, 36, 36);
      brassGrad.addColorStop(0, '#ffe89e');
      brassGrad.addColorStop(0.4, '#c99a3e');
      brassGrad.addColorStop(1, '#5e3f0a');
      ctx.strokeStyle = brassGrad;
      ctx.stroke();

      ctx.fillStyle = 'rgba(220, 240, 255, 0.22)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(-2, -2, 27, 3.8, 5.2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    const YEARS = Array.from({ length: 25 }, (_, i) => 2024 - i);
    let currentCountry = 'france';
    let currentRegion = '보르도';
    let currentYear = 2016;

    function initUI() {
      generateAppIcons();
      renderCountryTabs();
      renderRegionGrid();
    }

    function renderCountryTabs() {
      const tabs = document.getElementById('countryTabs');
      tabs.innerHTML = Object.entries(COUNTRY_DATA).map(([key, item]) => `
        <button onclick="selectCountry('${key}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border shrink-0 ${
          currentCountry === key ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-white text-slate-600 border-slate-200'
        }">
          ${item.flag} ${item.name}
        </button>
      `).join('');
    }

    function selectCountry(cKey) {
      currentCountry = cKey;
      currentRegion = COUNTRY_DATA[cKey].regions[0];
      renderCountryTabs();
      renderRegionGrid();
    }

    function renderRegionGrid() {
      const grid = document.getElementById('regionGrid');
      const regions = COUNTRY_DATA[currentCountry].regions;
      grid.innerHTML = regions.map(reg => `
        <button onclick="openBottomSheet('${reg}', 2019)" class="p-4 bg-white hover:border-indigo-400 active:scale-95 border border-slate-200 rounded-2xl text-left shadow-sm transition flex flex-col justify-between h-20">
          <span class="text-sm font-extrabold text-slate-800">${reg}</span>
          <span class="text-[11px] text-indigo-600 font-bold flex items-center justify-between">차트 열기 <span>→</span></span>
        </button>
      `).join('');
    }

    function openAiResultSheet(data) {
      document.getElementById('aiWineRegion').innerText = `${data.country || '와인'} · ${data.sub_region || '산지'}`;
      document.getElementById('aiWineName').innerText = data.wine_name || '식별된 와인';
      document.getElementById('aiVintageYear').innerText = `${data.vintage}년`;

      const badge = document.getElementById('aiGradeBadge');
      const card = document.getElementById('aiGradeCard');
      const comment = document.getElementById('aiGradeComment');

      comment.innerText = data.comment || '해당 빈티지의 작황 정보입니다.';

      if (data.grade === 'BEST') {
        badge.className = 'text-xs font-black px-3 py-1 rounded-full bg-emerald-600 text-white shadow-sm';
        badge.innerText = '🟢 강력 추천';
        card.className = 'rounded-2xl p-4 mb-4 border bg-emerald-50/60 border-emerald-200';
      } else if (data.grade === 'AVOID') {
        badge.className = 'text-xs font-black px-3 py-1 rounded-full bg-rose-600 text-white shadow-sm';
        badge.innerText = '🔴 어려웠던 빈티지';
        card.className = 'rounded-2xl p-4 mb-4 border bg-rose-50/60 border-rose-200';
      } else {
        badge.className = 'text-xs font-black px-3 py-1 rounded-full bg-amber-400 text-amber-950 shadow-sm';
        badge.innerText = '🟡 좋은 빈티지';
        card.className = 'rounded-2xl p-4 mb-4 border bg-amber-50/60 border-amber-200';
      }

      const backdrop = document.getElementById('aiResultBackdrop');
      const sheet = document.getElementById('aiResultSheet');
      backdrop.classList.remove('hidden');
      setTimeout(() => sheet.classList.remove('translate-y-full'), 10);
    }

    function closeAiResultSheet() {
      const sheet = document.getElementById('aiResultSheet');
      sheet.classList.add('translate-y-full');
      setTimeout(() => document.getElementById('aiResultBackdrop').classList.add('hidden'), 250);
    }

    document.getElementById('aiBackdropClickArea').addEventListener('click', closeAiResultSheet);

    function openBottomSheet(region, targetYear) {
      currentRegion = region;
      currentYear = targetYear || 2019;
      
      document.getElementById('sheetTitle').innerText = `${region} 빈티지 차트`;
      renderMatrix();
      updateDetailCard(currentYear);

      const backdrop = document.getElementById('bottomSheetBackdrop');
      const sheet = document.getElementById('bottomSheet');
      backdrop.classList.remove('hidden');
      setTimeout(() => sheet.classList.remove('translate-y-full'), 10);
    }

    function closeBottomSheet() {
      const sheet = document.getElementById('bottomSheet');
      sheet.classList.add('translate-y-full');
      setTimeout(() => document.getElementById('bottomSheetBackdrop').classList.add('hidden'), 250);
    }

    document.getElementById('backdropClickArea').addEventListener('click', closeBottomSheet);
    document.getElementById('closeSheetBtn').addEventListener('click', closeBottomSheet);

    function renderMatrix() {
      const container = document.getElementById('vintageMatrix');
      const scores = VINTAGE_SCORES[currentRegion] || {};

      container.innerHTML = YEARS.map(yr => {
        const item = scores[yr] || { g: 'GOOD' };
        let colorClass = 'bg-amber-400 text-amber-950 border-amber-500';
        if (item.g === 'BEST') colorClass = 'bg-emerald-600 text-white border-emerald-700 shadow-sm';
        if (item.g === 'AVOID') colorClass = 'bg-rose-500 text-white border-rose-600';

        const isSelected = yr === currentYear;
        return `
          <button onclick="selectYear(${yr})" class="py-2 rounded-xl text-xs font-black border transition flex flex-col items-center justify-center ${colorClass} ${
            isSelected ? 'ring-2 ring-slate-900 ring-offset-2 scale-105 z-10' : 'opacity-90'
          }">
            ${yr}
          </button>
        `;
      }).join('');
    }

    function selectYear(yr) {
      currentYear = yr;
      renderMatrix();
      updateDetailCard(yr);
    }

    function updateDetailCard(yr) {
      const scores = VINTAGE_SCORES[currentRegion] || {};
      const info = scores[yr] || { g: 'GOOD', c: '평이하고 무난한 작황' };
      document.getElementById('detailYearText').innerText = `${yr}년 ${currentRegion}`;
      
      const badge = document.getElementById('detailBadge');
      if (info.g === 'BEST') {
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800';
        badge.innerText = '🟢 강력 추천';
      } else if (info.g === 'AVOID') {
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-rose-100 text-rose-800';
        badge.innerText = '🔴 어려웠던 빈티지';
      } else {
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-900';
        badge.innerText = '🟡 좋은 빈티지';
      }

      document.getElementById('detailComment').innerText = info.c;
    }

    // ── 이미지 초경량 고속 압축 ──
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');

    cameraInput.addEventListener('change', handleFile);
    galleryInput.addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 640;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          sendToGemini(compressedBase64);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    // ── 사파리 방어 및 안전 통신 파이프라인 (35초 타이머) ──
    async function sendToGemini(base64Image) {
      const loader = document.getElementById('loadingOverlay');
      loader.classList.remove('hidden');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 35000);

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ image: base64Image }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const rawResponseText = await response.text();
        loader.classList.add('hidden');

        let res;
        try {
          res = JSON.parse(rawResponseText);
        } catch (jsonErr) {
          if (rawResponseText.includes("Google Accounts") || rawResponseText.includes("ServiceLogin")) {
            alert("⚠️ 서버 권한 오류:\nGoogle Apps Script의 [배포 관리]에서 '액세스 권한이 있는 사용자'를 '모든 사용자(Anyone)'로 변경해주세요.");
          } else {
            const cleanErr = rawResponseText.replace(/<[^>]*>?/gm, '').trim();
            alert(`⚠️ 서버 응답 오류:\n${cleanErr.substring(0, 150)}...`);
          }
          return;
        }

        if (!res.success) {
          alert(`분석 오류:\n${res.message || '서버 처리 중 오류가 발생했습니다.'}`);
          return;
        }

        const data = res.data;
        const currentYearLimit = new Date().getFullYear();
        if (!data.vintage || data.vintage < 1900 || data.vintage > currentYearLimit) {
          alert(`[${data.wine_name || '와인'}]을(를) 확인했으나 수확 연도를 찾을 수 없습니다.\nNV 와인이거나 연도가 다른 면에 있을 수 있습니다.`);
          return;
        }

        openAiResultSheet(data);

      } catch (err) {
        loader.classList.add('hidden');
        if (err.name === 'AbortError') {
          alert('요청 시간이 초과되었습니다.\n구글 서버 트래픽이 일시적으로 몰렸으니 다시 한 번 눌러주세요.');
        } else {
          alert(`네트워크 통신 오류: ${err.message}`);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initUI);
  </script>
</body>
</html>
